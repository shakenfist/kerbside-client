# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# The Python client and its tests, the shell, YAML and JSON that
# decide what CI runs and what dependency bumps are proposed, and the
# packaging and tox configuration -- which decides what gets installed
# alongside the client, and so is where a supply-chain change would
# land -- plus the Markdown documentation.
include = [
    '*.py',
    '*.sh',
    '*.md',
    '*.yml',
    '*.yaml',
    '*.json',
    '*.cfg',
    '*.ini',
    '*.toml',
]

# Named here rather than merely left out of include above, so that
# each one is a recorded decision that something should not be
# reviewed rather than a silence nobody chose.
exclude = [
    '.gitignore',           # tool configuration, no behaviour of its own
    'AUTHORS',              # a list of names, no behaviour
    'LICENSE',              # verbatim licence text
]
