[tox]
envlist = py3,flake8,cover
isolated_build = true

[testenv]
extras =
  test
commands =
    # NOTE: you can run any command line tool here - not just tests
    stestr run {posargs}
allowlist_externals =
  bash
  find
  rm
  env
  tar
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  OS_STDOUT_CAPTURE=1
  OS_STDERR_CAPTURE=1
  OS_TEST_TIMEOUT=160
  PYTHONDONTWRITEBYTECODE=1

[testenv:flake8]
description =
  Run style checks on the changes made since HEAD~.
envdir = {toxworkdir}/shared
commands =
  bash tools/flake8wrap.sh -HEAD

[testenv:py3]
description =
  Run the python3 unit tests.

[testenv:cover]
description =
  Generate a coverage report in cover/.
# {[testenv]setenv} is interpolated rather than replaced: a bare setenv
# here would drop the OS_*_CAPTURE settings above, and stestr would stop
# attaching a failing test's own output to it.
setenv =
  {[testenv]setenv}
  PYTHON=coverage run --source kerbside_client --parallel-mode
commands =
  coverage erase
  stestr run {posargs}
  coverage combine
  coverage html -d cover
  coverage report
