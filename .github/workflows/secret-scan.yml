# Repository secret scanning, as required by the secret-handling audit.
#
# A workflow of its own rather than a job in ci.yml, for two reasons.
# It needs a trigger set ci.yml does not have -- pull requests *and*
# pushes to the default branch, because a secret that reaches develop
# without a pull request still needs finding. And it is a content
# scanner: its whole point is to read the human-written text a path
# filter would skip, since a credential lands in docs/ or a plan as
# easily as in a module.
#
# Reference invocation: shakenfist/development/docs/audits/secret-handling.md
name: Secret scan

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # gitleaks-action@v2 refuses to run on organization repositories
  # without a paid licence, so the upstream binary is invoked directly.
  # gitleaks is only packaged from Debian 13 (trixie) onward -- bookworm
  # has no package -- so this job needs a debian-13 runner, which is
  # also why it is the one job here that cannot use the static pool.
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gitleaks
      cancel-in-progress: true

    steps:
      # fetch-depth: 0 matters, and tools/gitleaks-scan.sh refuses to
      # run without it. A secret committed and then reverted is still in
      # the history and still needs rotating; a shallow clone reports a
      # clean history it never looked at.
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      # The scan lives in a script rather than a run: line so that it
      # runs the same way locally as it does here -- which is the only
      # way anyone will check a change to it before pushing. The script
      # plants a credential and fails if gitleaks does not report it,
      # so a green run means "scanned and found nothing" rather than
      # "the scanner could not have found anything".
      - name: Run gitleaks
        run: tools/gitleaks-scan.sh
